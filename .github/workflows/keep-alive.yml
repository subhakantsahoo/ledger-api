# Backup for src/keepAlive.js: GitHub calls the live API every 14 minutes.
# If the Render server ever falls asleep (for example after a restart),
# this request wakes it up again.
name: Keep Render awake

on:
  schedule:
    - cron: "*/14 * * * *"
  # lets you run it by hand from the Actions tab
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call /health
        # a sleeping server can take up to a minute to wake up, hence the long timeout
        run: curl --fail --silent --show-error --max-time 90 --retry 3 --retry-delay 10 https://ledger-api-244a.onrender.com/health
